name: Build and Release
on:
  push:
    tags: ['v*']

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: extract_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libappindicator3-dev librsvg2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-dev patchelf jq

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Python (Linux)
        run: |
          chmod +x src-tauri/python/create-venvs.sh
          ./src-tauri/python/create-venvs.sh
          cd src-tauri
          jq --arg ver "${{ steps.extract_version.outputs.version }}" '.version = $ver | .bundle.resources = ["python/**/*"]' tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json
          sed -i 's/^version = ".*"/version = "'"${{ steps.extract_version.outputs.version }}"'"/' Cargo.toml

      - name: Build App
        run: npm install && npm run build && npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: src-tauri/target/release/bundle/appimage/

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_KMS_SERVICE_ACCOUNT_KEY }}'
          export_environment_variables: true

      - name: Extract version
        id: extract_version
        run: echo "version=$($env:GITHUB_REF -replace 'refs/tags/v', '')" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable

      # ------------------------------------------------------------------
      # STEP A: prepare everything signing needs BEFORE the build.
      # (Previously this all happened after the build, which was too late.)
      # Results are exported as env vars so scripts/sign-windows.ps1 can use
      # them, both from this workflow and when called by Tauri's signCommand.
      # ------------------------------------------------------------------
      - name: Prepare code signing (jsign, KMS token, certificate)
        shell: pwsh
        run: |
          # jsign
          $jsign = Join-Path $env:RUNNER_TEMP "jsign.jar"
          Invoke-WebRequest -Uri "https://github.com/ebourg/jsign/releases/download/6.0/jsign-6.0.jar" -OutFile $jsign

          # Service account credentials (exported by the google auth action)
          $creds = Get-Content $env:GOOGLE_APPLICATION_CREDENTIALS | ConvertFrom-Json

          function ConvertTo-Base64Url([byte[]]$bytes) {
            [Convert]::ToBase64String($bytes) -replace '=+$','' -replace '\+','-' -replace '/','_'
          }

          # Build a JWT and exchange it for an OAuth2 access token (valid 1 hour)
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $exp = $now + 3600
          $header = ConvertTo-Base64Url ([Text.Encoding]::UTF8.GetBytes('{"alg":"RS256","typ":"JWT"}'))
          $claims = ConvertTo-Base64Url ([Text.Encoding]::UTF8.GetBytes(
            (@{ iss = $creds.client_email; scope = "https://www.googleapis.com/auth/cloudkms"; aud = "https://oauth2.googleapis.com/token"; exp = $exp; iat = $now } | ConvertTo-Json -Compress)))
          $toSign = "$header.$claims"

          $rsa = [System.Security.Cryptography.RSA]::Create()
          $pem = $creds.private_key -replace "-----BEGIN PRIVATE KEY-----",'' -replace "-----END PRIVATE KEY-----",'' -replace "\s",''
          $rsa.ImportPkcs8PrivateKey([Convert]::FromBase64String($pem), [ref]$null)
          $sig = ConvertTo-Base64Url ($rsa.SignData([Text.Encoding]::UTF8.GetBytes($toSign), [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1))
          $jwt = "$toSign.$sig"

          $tokenResponse = Invoke-RestMethod -Uri "https://oauth2.googleapis.com/token" -Method POST `
            -ContentType "application/x-www-form-urlencoded" `
            -Body "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=$jwt"
          $accessToken = $tokenResponse.access_token
          if (-not $accessToken) { Write-Error "Failed to get access token"; exit 1 }
          Write-Host "Got access token"

          # Keystore / key name from the KMS key path secret
          $keyPath = "${{ secrets.GCP_KMS_KEY_PATH }}".Trim().Trim('"').Trim("'")
          $parts = $keyPath -split "/"
          $keystore = "projects/$($parts[1])/locations/$($parts[3])/keyRings/$($parts[5])"
          $keyName = $parts[7]

          # Certificate chain (leaf + Sectigo intermediates) to a file
          $certPath = Join-Path $env:RUNNER_TEMP "sectigo_full.crt"
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String("${{ secrets.SECTIGO_CERT_BASE64 }}"))

          # Hide the token in logs, then export for later steps
          Write-Host "::add-mask::$accessToken"
          "GCP_ACCESS_TOKEN=$accessToken" >> $env:GITHUB_ENV
          "KMS_KEYSTORE=$keystore"        >> $env:GITHUB_ENV
          "KMS_KEY=$keyName"              >> $env:GITHUB_ENV
          "SIGN_CERT_PATH=$certPath"      >> $env:GITHUB_ENV
          "JSIGN_JAR=$jsign"              >> $env:GITHUB_ENV

      - name: Build Python (Windows)
        shell: pwsh
        run: |
          cd src-tauri/python
          ./create-windows-python.ps1
          cd ../..
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', 'version = "${{ steps.extract_version.outputs.version }}"' | Set-Content src-tauri/Cargo.toml

      # ------------------------------------------------------------------
      # STEP B: sign the bundled Python runtime (python.exe, DLLs, .pyd).
      # These ship inside the installer, so they must be signed BEFORE the
      # build packages them. Files that already carry a valid signature
      # (e.g. python.org / Microsoft files) are left alone.
      # ------------------------------------------------------------------
      - name: Sign bundled Python binaries
        shell: pwsh
        run: |
          $files = Get-ChildItem "src-tauri/python/windows-python" -Recurse -Include *.exe,*.dll,*.pyd |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq 'NotSigned' } |
            ForEach-Object { $_.FullName }

          Write-Host "Unsigned binaries to sign: $($files.Count)"

          # One jsign call per chunk (much faster than one JVM start per file)
          $chunkSize = 40
          for ($i = 0; $i -lt $files.Count; $i += $chunkSize) {
            $chunk = $files[$i..([Math]::Min($i + $chunkSize, $files.Count) - 1)]
            & "$env:GITHUB_WORKSPACE\scripts\sign-windows.ps1" @chunk
            if ($LASTEXITCODE -ne 0) { Write-Error "Signing failed"; exit 1 }
          }

      # ------------------------------------------------------------------
      # STEP C: tell Tauri to sign every binary itself during the build.
      # Tauri calls signCommand for the app .exe BEFORE packing it into the
      # MSI, signs the MSI, and only then generates the updater .sig, so
      # the updater signature stays valid.
      # ------------------------------------------------------------------
      - name: Configure Tauri (version, resources, signCommand)
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $conf = Get-Content $path -Raw | ConvertFrom-Json
          $conf.version = "${{ steps.extract_version.outputs.version }}"
          $conf.bundle.resources = @("python/**/*")

          if (-not $conf.bundle.windows) {
            $conf.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{})
          }
          $signCommand = [pscustomobject]@{
            cmd  = "powershell"
            args = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "$env:GITHUB_WORKSPACE\scripts\sign-windows.ps1", "%1")
          }
          $conf.bundle.windows | Add-Member -NotePropertyName signCommand -NotePropertyValue $signCommand -Force

          $conf | ConvertTo-Json -Depth 20 | Set-Content $path

      - name: Build App
        run: npm install && npm run build && npx tauri build --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # ------------------------------------------------------------------
      # STEP D: verify instead of re-signing. Fails the job if anything
      # that users will actually run is unsigned.
      # ------------------------------------------------------------------
      - name: Verify signatures (installer AND contents)
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi"
          $msi = Get-ChildItem "$bundle/*.msi" | Select-Object -First 1
          $failed = $false

          $s = Get-AuthenticodeSignature $msi.FullName
          Write-Host "MSI: $($s.Status) - $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { $failed = $true }

          # Unpack the MSI without installing, then inspect what users would get
          $extract = Join-Path $env:RUNNER_TEMP "msi-extract"
          Start-Process msiexec -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$extract`"" -Wait

          Get-ChildItem $extract -Recurse -Include *.exe,*.dll,*.pyd | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            if ($sig.Status -eq 'NotSigned') {
              Write-Host "UNSIGNED: $($_.FullName)"
              $failed = $true
            } elseif ($sig.Status -ne 'Valid') {
              Write-Host "WARNING ($($sig.Status)): $($_.FullName)"
            }
          }

          if ($failed) { Write-Error "Signature verification failed"; exit 1 }
          Write-Host "All binaries are signed"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/

      - name: Clean up signing secrets
        if: always()
        shell: pwsh
        run: |
          Remove-Item $env:SIGN_CERT_PATH -ErrorAction SilentlyContinue
          Remove-Item $env:JSIGN_JAR -ErrorAction SilentlyContinue

  upload-updates:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: extract_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install @aws-sdk/client-s3
      - name: Upload to S3
        run: node scripts/upload-update.js
        env:
          APP_VERSION: ${{ steps.extract_version.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

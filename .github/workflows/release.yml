name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate Python Virtual Environments
        run: |
          cd src-tauri/python
          chmod +x create-venvs.sh
          ./create-venvs.sh
          cd ../../..

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Linux)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: src-tauri/target/release/bundle/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate Python Virtual Environments
        run: |
          cd src-tauri/python
          # On Windows CI, create Windows venv using system Python
          python -m venv windows-venv
          .\windows-venv\Scripts\pip install --upgrade pip
          .\windows-venv\Scripts\pip install -r requirements.txt
          cd ../../..

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Windows)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate macOS Python Virtual Environment
        run: |
          cd src-tauri/python
          # Create the portable macOS venv
          chmod +x create-macos-venv.sh
          ./create-macos-venv.sh
          
          # Verify it works
          echo "Verifying macOS venv..."
          if ./macos-venv/bin/python -c "import pandas, numpy, groq, matplotlib; print('All packages work')"; then
            echo "✓ macOS venv verified"
          else
            echo "✗ macOS venv verification failed"
            exit 1
          fi
          cd ../../..

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (macOS) - Skip DMG
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/

  upload-updates:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist/linux/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/windows/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: dist/macos/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm install @aws-sdk/client-s3

      - name: Upload updates to S3
        run: node scripts/upload-update.js
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_REF: ${{ github.ref }}

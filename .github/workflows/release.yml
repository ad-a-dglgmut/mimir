name: Build and Release
on:
  push:
    tags: ['v*']

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: extract_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libappindicator3-dev librsvg2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-dev patchelf jq

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Python (Linux)
        run: |
          chmod +x src-tauri/python/create-venvs.sh
          ./src-tauri/python/create-venvs.sh
          cd src-tauri
          jq --arg ver "${{ steps.extract_version.outputs.version }}" '.version = $ver | .bundle.resources = ["python/**/*"]' tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json
          sed -i 's/^version = ".*"/version = "'"${{ steps.extract_version.outputs.version }}"'"/' Cargo.toml

      - name: Build App
        run: npm install && npm run build && npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: src-tauri/target/release/bundle/appimage/

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_KMS_SERVICE_ACCOUNT_KEY }}'
          export_environment_variables: true

      - name: Extract version
        id: extract_version
        run: echo "version=$($env:GITHUB_REF -replace 'refs/tags/v', '')" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Add Signtool to PATH
        shell: pwsh
        run: |
          $getSigntool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1
          if ($getSigntool) {
              $signtoolPath = Split-Path $getSigntool.FullName
              echo "$signtoolPath" >> $env:GITHUB_PATH
          }

      - name: Build Python (Windows)
        shell: pwsh
        run: |
          cd src-tauri/python
          ./create-windows-python.ps1
          cd ../..
          $tauriConf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $tauriConf.bundle.resources = @("python/**/*")
          $tauriConf.version = "${{ steps.extract_version.outputs.version }}"
          $tauriConf | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json"
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', 'version = "${{ steps.extract_version.outputs.version }}"' | Set-Content src-tauri/Cargo.toml

      - name: Install Google Cloud KMS CNG Provider
        shell: pwsh
        run: |
          $url = "https://github.com/GoogleCloudPlatform/kms-integrations/releases/download/cng-v1.3/kmscng-1.3-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile kms-cng.zip
          Expand-Archive -Path kms-cng.zip -DestinationPath ./kms_temp -Force
          $msi = Get-ChildItem -Path ./kms_temp -Filter "*.msi" -Recurse | Select-Object -First 1
          Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart" -Wait
          
          $configDir = "C:\Windows\KMSCNG"
          if (!(Test-Path $configDir)) { New-Item -ItemType Directory -Path $configDir -Force }
          
          $keyPath = "${{ secrets.GCP_KMS_KEY_PATH }}".Trim().Trim('"').Trim("'")
          $configRaw = "resources:`n  - crypto_key_version: `"$keyPath`"`n"
          
          $encoding = New-Object System.Text.UTF8Encoding($false)
          $bytes = $encoding.GetBytes($configRaw)
          [System.IO.File]::WriteAllBytes("$configDir\config.yaml", $bytes)
          
          icacls "$configDir" /grant "Everyone:(OI)(CI)F" /T
          echo "C:\Program Files\Google\Cloud KMS CNG Provider" >> $env:GITHUB_PATH

      - name: Build App
        run: npm install && npm run build && npx tauri build --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Sign and Verify Windows Binaries
        shell: pwsh
        run: |
          $env:KMS_CNG_LOG_LEVEL = "debug"
          $env:KMS_CNG_CONFIG = "C:\Windows\KMSCNG\config.yaml"
          
          $keyPath = "${{ secrets.GCP_KMS_KEY_PATH }}".Trim().Trim('"').Trim("'")
          $csp = "Google Cloud KMS CNG Provider"
          
          # 1. Load Certificate and Import
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.SECTIGO_CERT_BASE64 }}")
          $certPath = "$pwd\sectigo_full.crt"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          Import-Certificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My
          
          $objCert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($certPath)
          $thumbprint = $objCert.Thumbprint

          # 2. Direct Registry Association
          # This links the thumbprint directly to the GCP KMS Provider & Key Path
          certutil -user -setreg "Cert\CurrentUser\My\$thumbprint\Key Provider" "$csp"
          certutil -user -setreg "Cert\CurrentUser\My\$thumbprint\Key Container" "$keyPath"

          # 3. Final Signing Loop
          $tsUrl = "http://timestamp.sectigo.com/rfc3161"
          $filesToSign = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi", "src-tauri/target/x86_64-pc-windows-msvc/release/*.exe"
          
          foreach ($file in $filesToSign) {
            Write-Host "--- Signing: $($file.FullName) ---"
            # Explicitly passing /csp and /kc is the most stable way for Cloud KMS
            signtool sign /v /debug /fd sha256 /tr "$tsUrl" /td sha256 /sha1 $thumbprint /csp "$csp" /kc "$keyPath" $file.FullName
            
            if ($LASTEXITCODE -ne 0) { 
              Write-Error "Signing failed. Check GCP IAM roles (Signer/Verifier) and Key Path."
              exit 1 
            }
            signtool verify /v /pa $file.FullName
            Start-Sleep -Seconds 2
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/

  upload-updates:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: extract_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install @aws-sdk/client-s3
      - name: Upload to S3
        run: node scripts/upload-update.js
        env:
          APP_VERSION: ${{ steps.extract_version.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

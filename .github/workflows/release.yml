name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            patchelf \
            jq

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build Python Environment (Linux)
        run: |
          # Execute the script from project root
          chmod +x src-tauri/python/create-venvs.sh
          ./src-tauri/python/create-venvs.sh
          
          # Update tauri.conf.json to bundle the 'python' folder and set version
          cd src-tauri
          VERSION="${{ steps.extract_version.outputs.version }}"
          jq --arg ver "$VERSION" '.version = $ver | .bundle.resources = ["python/**/*"]' tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json
          
          # Update Cargo.toml version
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          cd ..

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Linux)
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APP_VERSION: ${{ steps.extract_version.outputs.version }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: src-tauri/target/release/bundle/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: extract_version
        run: |
          $version = "$env:GITHUB_REF" -replace 'refs/tags/v', ''
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Node and Rust
        uses: actions/setup-node@v4
        with: { node-version: 20 }
        
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install JS dependencies
        run: npm install

      - name: Setup Windows Python (Embeddable)
        shell: pwsh
        run: |
          # Navigate into the folder so the PS1 creates 'windows-python' inside it
          cd src-tauri/python
          ./create-windows-python.ps1
          cd ../..

      - name: Prepare Windows Bundle Configuration
        shell: pwsh
        run: |
          $version = "${{ steps.extract_version.outputs.version }}"
          cd src-tauri
          
          # Update tauri.conf.json: bundle the 'python' folder and sync version
          $json = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          $json.bundle.resources = @("python/**/*")
          $json.version = $version
          $json | ConvertTo-Json -Depth 10 | Set-Content tauri.conf.json
          
          # Sync Cargo.toml version
          $content = Get-Content Cargo.toml
          $content -replace '^version = ".*"', "version = `"$version`"" | Set-Content Cargo.toml
          cd ..

      - name: Build frontend
        run: npm run build

      - name: Build Tauri App (Windows)
        run: npx tauri build --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APP_VERSION: ${{ steps.extract_version.outputs.version }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/

  upload-updates:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: extract_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install uploader dependencies
        run: npm install @aws-sdk/client-s3

      - name: Upload to S3
        run: node scripts/upload-update.js
        env:
          GITHUB_REF: ${{ github.ref }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APP_VERSION: ${{ steps.extract_version.outputs.version }}
          # Path to where artifacts were downloaded
          ARTIFACT_PATH: dist-artifacts

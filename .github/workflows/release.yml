name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Update Tauri version (tauri.conf.json + Cargo.toml)
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          cd src-tauri

          jq --arg version "$VERSION" '.version = $version' tauri.conf.json > tmp.json
          mv tmp.json tauri.conf.json

          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml

          grep '"version"' tauri.conf.json
          grep '^version =' Cargo.toml

          cd ..

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            patchelf \
            jq

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate Python Virtual Environments
        run: |
          cd src-tauri/python
          chmod +x create-venvs.sh
          ./create-venvs.sh
          cd ../../..

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Linux)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APP_VERSION: ${{ steps.extract_version.outputs.version }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: src-tauri/target/release/bundle/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          $version = "$env:GITHUB_REF" -replace 'refs/tags/v', ''
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Update Tauri version (tauri.conf.json + Cargo.toml)
        shell: pwsh
        run: |
          $version = "${{ steps.extract_version.outputs.version }}"
          cd src-tauri

          $json = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          $json.version = $version
          $json | ConvertTo-Json -Depth 10 | Set-Content tauri.conf.json

          $content = Get-Content Cargo.toml
          $content -replace '^version = ".*"', "version = `"$version`"" | Set-Content Cargo.toml

          Select-String -Path Cargo.toml -Pattern '^version ='

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate Python Virtual Environments (Windows)
        run: |
          cd src-tauri/python
          if (Test-Path "create-venvs.ps1") {
            powershell -ExecutionPolicy Bypass -File create-venvs.ps1
          }
          cd ..\..

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Windows)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APP_VERSION: ${{ steps.extract_version.outputs.version }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/

  upload-updates:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Uploading latest.json for version ${VERSION}"

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/windows

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install uploader dependencies
        run: npm install @aws-sdk/client-s3

      - name: Upload latest.json and artifacts
        run: node scripts/upload-update.js
        env:
          GITHUB_REF: ${{ github.ref }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

name: Build and Release
on:
  push:
    tags: ['v*']

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: extract_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libappindicator3-dev librsvg2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-dev patchelf jq

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Python (Linux)
        run: |
          chmod +x src-tauri/python/create-venvs.sh
          ./src-tauri/python/create-venvs.sh
          cd src-tauri
          jq --arg ver "${{ steps.extract_version.outputs.version }}" '.version = $ver | .bundle.resources = ["python/**/*"]' tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json
          sed -i 's/^version = ".*"/version = "'"${{ steps.extract_version.outputs.version }}"'"/' Cargo.toml

      - name: Build App
        run: npm install && npm run build && npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: src-tauri/target/release/bundle/appimage/

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_KMS_SERVICE_ACCOUNT_KEY }}'
          export_environment_variables: true

      - name: Extract version
        id: extract_version
        run: echo "version=$($env:GITHUB_REF -replace 'refs/tags/v', '')" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Add Signtool to PATH
        shell: pwsh
        run: |
          $getSigntool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1
          if ($getSigntool) {
              $signtoolPath = Split-Path $getSigntool.FullName
              echo "$signtoolPath" >> $env:GITHUB_PATH
          }

      - name: Build Python (Windows)
        shell: pwsh
        run: |
          cd src-tauri/python
          ./create-windows-python.ps1
          cd ../..
          $tauriConf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $tauriConf.bundle.resources = @("python/**/*")
          $tauriConf.version = "${{ steps.extract_version.outputs.version }}"
          $tauriConf | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json"
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', 'version = "${{ steps.extract_version.outputs.version }}"' | Set-Content src-tauri/Cargo.toml

      - name: Build App
        run: npm install && npm run build && npx tauri build --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Sign Windows Binaries with jsign
        shell: pwsh
        run: |
          # Download jsign
          Invoke-WebRequest -Uri "https://github.com/ebourg/jsign/releases/download/6.0/jsign-6.0.jar" -OutFile jsign.jar

          # Load service account credentials
          $credsPath = $env:GOOGLE_APPLICATION_CREDENTIALS
          Write-Host "Using credentials from: $credsPath"
          $creds = Get-Content $credsPath | ConvertFrom-Json
          Write-Host "Service account: $($creds.client_email)"

          # Generate OAuth2 access token via JWT
          $now = [int][double]::Parse((Get-Date -UFormat %s))
          $exp = $now + 3600
          $scope = "https://www.googleapis.com/auth/cloudkms"

          $header = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('{"alg":"RS256","typ":"JWT"}')) -replace '=+$','' -replace '\+','-' -replace '/','_'
          $claims = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("{`"iss`":`"$($creds.client_email)`",`"scope`":`"$scope`",`"aud`":`"https://oauth2.googleapis.com/token`",`"exp`":$exp,`"iat`":$now}")) -replace '=+$','' -replace '\+','-' -replace '/','_'

          $toSign = "$header.$claims"

          $rsaKey = [System.Security.Cryptography.RSA]::Create()
          $privateKeyPem = $creds.private_key -replace "-----BEGIN PRIVATE KEY-----",'' -replace "-----END PRIVATE KEY-----",'' -replace "`n",'' -replace "`r",''
          $privateKeyBytes = [Convert]::FromBase64String($privateKeyPem)
          $rsaKey.ImportPkcs8PrivateKey($privateKeyBytes, [ref]$null)

          $toSignBytes = [Text.Encoding]::UTF8.GetBytes($toSign)
          $signatureBytes = $rsaKey.SignData($toSignBytes, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)
          $signature = [Convert]::ToBase64String($signatureBytes) -replace '=+$','' -replace '\+','-' -replace '/','_'

          $jwt = "$toSign.$signature"

          $tokenResponse = Invoke-RestMethod -Uri "https://oauth2.googleapis.com/token" -Method POST -ContentType "application/x-www-form-urlencoded" -Body "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=$jwt"
          $accessToken = $tokenResponse.access_token

          if (-not $accessToken) {
            Write-Error "❌ Failed to get access token"
            exit 1
          }
          Write-Host "✅ Got access token"

          # Parse key path into components
          $keyPath = "${{ secrets.GCP_KMS_KEY_PATH }}".Trim().Trim('"').Trim("'")
          $parts = $keyPath -split "/"
          $projectId = $parts[1]
          $location  = $parts[3]
          $keyRing   = $parts[5]
          $keyName   = $parts[7]

          $keystore = "projects/$projectId/locations/$location/keyRings/$keyRing"
          Write-Host "Keystore: $keystore"
          Write-Host "Key:      $keyName"

          # Write cert to file
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.SECTIGO_CERT_BASE64 }}")
          $certPath = "$pwd\sectigo_full.crt"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)

          $tsUrl = "http://timestamp.sectigo.com/rfc3161"
          $filesToSign = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi", "src-tauri/target/x86_64-pc-windows-msvc/release/*.exe"

          foreach ($file in $filesToSign) {
            Write-Host "--- Signing: $($file.FullName) ---"
            java -jar jsign.jar `
              --storetype GOOGLECLOUD `
              --storepass "$accessToken" `
              --keystore "$keystore" `
              --alias "$keyName" `
              --certfile "$certPath" `
              --tsaurl "$tsUrl" `
              --tsmode RFC3161 `
              "$($file.FullName)"

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Signing failed."
              exit 1
            }

            Write-Host "--- Verifying: $($file.FullName) ---"
            signtool verify /v /pa "$($file.FullName)"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/

  upload-updates:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: extract_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install @aws-sdk/client-s3
      - name: Upload to S3
        run: node scripts/upload-update.js
        env:
          APP_VERSION: ${{ steps.extract_version.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Update Tauri version files
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          cd src-tauri

          jq --arg v "$VERSION" '.version = $v' tauri.conf.json > tmp.json
          mv tmp.json tauri.conf.json

          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml

          grep '"version"' tauri.conf.json
          grep '^version =' Cargo.toml

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            jq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Linux)
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: src-tauri/target/release/bundle/

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          $v = "$env:GITHUB_REF" -replace 'refs/tags/v',''
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Update Tauri version files
        run: |
          $version = "${{ steps.extract_version.outputs.version }}"
          cd src-tauri

          $json = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          $json.version = $version
          $json | ConvertTo-Json -Depth 10 | Set-Content tauri.conf.json

          $content = Get-Content Cargo.toml
          $content -replace '^version = ".*"', "version = `"$version`"" | Set-Content Cargo.toml

          Select-String Cargo.toml '^version ='

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Windows)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/

  upload-updates:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist/linux

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/windows

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install @aws-sdk/client-s3

      - name: Upload updates
        run: node scripts/upload-update.js
        env:
          APP_VERSION: ${{ steps.extract_version.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

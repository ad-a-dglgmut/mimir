name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Update Tauri version (tauri.conf.json + Cargo.toml)
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          echo "Updating version to $VERSION"

          cd src-tauri

          # Update tauri.conf.json
          jq --arg version "$VERSION" '.version = $version' tauri.conf.json > tmp.json
          mv tmp.json tauri.conf.json
          echo "tauri.conf.json version updated:"
          grep '"version"' tauri.conf.json

          # Update Cargo.toml
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          echo "Cargo.toml version updated:"
          grep '^version =' Cargo.toml

          cd ..

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            patchelf \
            jq

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate Python Virtual Environments
        run: |
          cd src-tauri/python
          chmod +x create-venvs.sh
          ./create-venvs.sh
          cd ../../..

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Linux)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APP_VERSION: ${{ steps.extract_version.outputs.version }}

      - name: Verify Linux build version
        run: |
          echo "Verifying built version..."
          # Check AppImage version if it exists
          if ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null; then
            echo "AppImage built for version: ${{ steps.extract_version.outputs.version }}"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: src-tauri/target/release/bundle/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          $version = "$env:GITHUB_REF" -replace 'refs/tags/v', ''
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "Building version: $version"

      - name: Update Tauri version (tauri.conf.json + Cargo.toml) - Windows
        run: |
          $version = "${{ steps.extract_version.outputs.version }}"
          Write-Host "Updating version to $version"

          cd src-tauri

          # Update tauri.conf.json
          $json = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          $json.version = $version
          $json | ConvertTo-Json -Depth 10 | Set-Content tauri.conf.json
          Write-Host "tauri.conf.json version updated:" $json.version

          # Update Cargo.toml
          $content = Get-Content Cargo.toml
          $replacement = 'version = "' + $version + '"'
          $content -replace '^version = ".*"', $replacement | Set-Content Cargo.toml
          Write-Host "Cargo.toml version updated:" ((Get-Content Cargo.toml | Select-String '^version =').Line)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate Python Virtual Environments (Windows)
        run: |
          cd src-tauri/python
          if (Test-Path "create-venvs.ps1") {
            powershell -ExecutionPolicy Bypass -File create-venvs.ps1
          }
          cd ..\..

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Windows)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APP_VERSION: ${{ steps.extract_version.outputs.version }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/


name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Update Tauri version (tauri.conf.json + Cargo.toml)
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          cd src-tauri

          jq --arg version "$VERSION" '.version = $version' tauri.conf.json > tmp.json
          mv tmp.json tauri.conf.json

          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml

          grep '"version"' tauri.conf.json
          grep '^version =' Cargo.toml

          cd ..

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            patchelf \
            jq

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate Python Virtual Environments
        run: |
          cd src-tauri/python
          chmod +x create-venvs.sh
          ./create-venvs.sh
          cd ../../..

      # CRITICAL: Copy Python files to the correct location for bundling
      - name: Prepare Python for bundling (Linux)
        run: |
          chmod +x src-tauri/python/create-venvs.sh
          ./src-tauri/python/create-venvs.sh
          
          # Update tauri.conf.json to include the 'python' folder
          cd src-tauri
          jq '.bundle.resources = ["python/**/*"]' tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Linux)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APP_VERSION: ${{ steps.extract_version.outputs.version }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: src-tauri/target/release/bundle/

build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: extract_version
        run: |
          $version = "$env:GITHUB_REF" -replace 'refs/tags/v', ''
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Node and Rust
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: npm install

      - name: Setup Windows Python (Embeddable)
        shell: pwsh
        run: |
          cd src-tauri/python
          ./create-windows-python.ps1
          cd ../..

      - name: Prepare Python for bundling (Windows)
        shell: pwsh
        run: |
          # Ensure tauri.conf.json is updated to bundle the 'python' folder
          $tauriConf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $tauriConf.bundle.resources = @("python/**/*")
          $tauriConf.version = "${{ steps.extract_version.outputs.version }}"
          $tauriConf | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json"
          
          Write-Host "=== Bundle configuration updated ===" -ForegroundColor Green

      - name: Build Tauri App
        run: npm run tauri build -- --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/

  upload-updates:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Uploading latest.json for version ${VERSION}"

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/windows

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install uploader dependencies
        run: npm install @aws-sdk/client-s3

      - name: Upload latest.json and artifacts
        run: node scripts/upload-update.js
        env:
          GITHUB_REF: ${{ github.ref }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APP_VERSION: ${{ steps.extract_version.outputs.version }}
